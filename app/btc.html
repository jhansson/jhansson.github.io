<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BTC/USD — Quote Terminal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23050302'/%3E%3Ctext x='50' y='70' font-size='58' text-anchor='middle' font-family='monospace' fill='%23ffb000'%3E%24%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root{
    --void:#050302; --bezel1:#1b140d; --bezel2:#2c2014;
    --screen:#0a0703; --amber:#ffb000; --amber-dim:#8a5c00; --amber-faint:#4d3400;
    --green:#3dff7a; --red:#ff4433; --cyan:#5ad1ff; --text-dim:#a37b32;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;background:var(--void);overflow:hidden;}
  body{font-family:'Space Mono',monospace;display:flex;align-items:center;justify-content:center;padding:2vh 2vw;}
  .bezel{
    width:100%;height:100%;max-width:1400px;
    background:linear-gradient(160deg,var(--bezel2),var(--bezel1) 60%);
    border-radius:22px;padding:14px;
    box-shadow:0 30px 60px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.05);
  }
  .screen{
    position:relative;height:100%;
    background:radial-gradient(120% 140% at 50% 0%, #120c05 0%, var(--screen) 60%);
    border-radius:12px;border:1px solid #000;
    box-shadow:inset 0 0 60px rgba(0,0,0,.85), inset 0 0 2px var(--amber-dim);
    overflow:hidden;display:flex;flex-direction:column;
    padding:clamp(14px,2.5vh,28px) clamp(16px,3vw,40px);color:var(--amber);
  }
  .scanlines{
    position:absolute;inset:0;pointer-events:none;z-index:5;
    background:repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,.25) 3px);
    mix-blend-mode:multiply;
  }
  .topbar{display:flex;justify-content:space-between;align-items:center;font-size:clamp(11px,1.3vw,14px);letter-spacing:.12em;color:var(--text-dim);border-bottom:1px solid var(--amber-faint);padding-bottom:10px;}
  .status{display:flex;align-items:center;gap:8px;}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--amber-dim);animation:blink 1.4s steps(2) infinite;}
  .dot.live{background:var(--green);box-shadow:0 0 8px var(--green);}
  .dot.err{background:var(--red);box-shadow:0 0 8px var(--red);}
  @keyframes blink{50%{opacity:.25;}}

  main{flex:1;display:flex;flex-direction:column;align-items:center;min-height:0;padding-top:clamp(10px,2vh,24px);}
  .quote{text-align:center;}
  .quote.hidden{display:none;}
  .eyebrow{font-size:clamp(10px,1.1vw,13px);letter-spacing:.25em;color:var(--text-dim);}
  h1{font-family:'VT323',monospace;font-weight:400;font-size:clamp(48px,11vw,140px);line-height:1;color:var(--amber);
     text-shadow:0 0 18px rgba(255,176,0,.5),0 0 40px rgba(255,176,0,.25);margin-top:4px;}
  h1.up{color:var(--green);text-shadow:0 0 18px rgba(61,255,122,.55),0 0 42px rgba(61,255,122,.25);}
  h1.down{color:var(--red);text-shadow:0 0 18px rgba(255,68,51,.55),0 0 42px rgba(255,68,51,.25);}
  .cursor{display:inline-block;animation:blink 1s steps(2) infinite;}
  .change{font-size:clamp(13px,1.6vw,18px);margin-top:6px;letter-spacing:.08em;}
  .change.up{color:var(--green);}
  .change.down{color:var(--red);}
  .hl{font-size:clamp(11px,1.2vw,14px);color:var(--text-dim);margin-top:4px;letter-spacing:.08em;}

  #chart{width:100%;flex:1;min-height:120px;margin-top:clamp(10px,2vh,20px);}
  #error{color:var(--red);font-size:12px;text-align:center;letter-spacing:.05em;min-height:16px;}

  .controls{display:flex;gap:10px;justify-content:center;border-top:1px solid var(--amber-faint);padding-top:12px;flex-wrap:wrap;}
  .key{font-family:'Space Mono',monospace;font-size:clamp(11px,1.3vw,13px);letter-spacing:.08em;
       background:transparent;color:var(--amber);border:1px solid var(--amber-dim);
       padding:8px 16px;border-radius:3px;cursor:pointer;}
  .key:hover{border-color:var(--amber);}
  .key.active{background:var(--amber);color:#100b04;border-color:var(--amber);}

  @media (max-width:600px){
    .topbar{font-size:10px;}
    .controls{gap:6px;}
    .key{padding:6px 10px;}
  }
</style>
</head>
<body>
  <div class="bezel">
    <div class="screen">
      <div class="scanlines"></div>
      <header class="topbar">
        <span class="brand">BTC-USD QUOTE TERMINAL</span>
        <span class="status"><span class="dot" id="dot"></span><span id="clock">--:--:--</span></span>
      </header>

      <main>
        <div class="quote" id="quoteView">
          <p class="eyebrow">BTC / USD LAST TRADE</p>
          <h1 id="price">-- <span class="cursor">▮</span></h1>
          <p class="change" id="change">24H —</p>
          <p class="hl" id="hl">H — · L —</p>
        </div>
        <div class="quote hidden" id="hashView">
          <p class="eyebrow">NETWORK HASHRATE</p>
          <h1 id="hashPrice">-- <span class="cursor">▮</span></h1>
          <p class="change" id="hashChange">QUARTERLY AVG</p>
        </div>

        <div id="chart"></div>
        <p id="error"></p>
      </main>

      <footer class="controls">
        <button class="key active" data-view="price">F1 · PRICE</button>
        <button class="key" data-view="hashrate">F2 · HASHRATE</button>
        <button class="key" id="timeToggle">F3 · 1H</button>
      </footer>
    </div>
  </div>

<script>
  const $ = id => document.getElementById(id);
  const priceEl=$('price'), changeEl=$('change'), hlEl=$('hl');
  const hashPriceEl=$('hashPrice'), hashChangeEl=$('hashChange');
  const errorEl=$('error'), dotEl=$('dot'), clockEl=$('clock'), chartEl=$('chart');
  let chart, series, lineSeries;
  let currentView='price', currentInterval='hour';

  function tickClock(){ clockEl.textContent=new Date().toLocaleTimeString('en-US',{hour12:false}); }
  setInterval(tickClock,1000); tickClock();

  const fmt = n => new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n);

  function buildChart(){
    if(chart) chart.remove();
    chart = LightweightCharts.createChart(chartEl,{
      width:chartEl.clientWidth, height:chartEl.clientHeight,
      layout:{background:{color:'transparent'},textColor:'#8a5c00'},
      grid:{vertLines:{color:'rgba(138,92,0,.15)'},horzLines:{color:'rgba(138,92,0,.15)'}},
      crosshair:{vertLine:{color:'#5ad1ff',width:1,style:2},horzLine:{color:'#5ad1ff',width:1,style:2}},
      rightPriceScale:{borderColor:'#4d3400'},
      timeScale:{borderColor:'#4d3400',timeVisible:true,secondsVisible:false,fixLeftEdge:true,fixRightEdge:true},
    });
  }

  async function loadPrice(){
    try{
      errorEl.textContent='';
      const interval = currentInterval==='hour' ? 60 : 15;
      const res = await fetch(`https://api.kraken.com/0/public/OHLC?pair=XBTUSD&interval=${interval}`);
      const data = await res.json();
      if(!res.ok || data.error?.length) throw new Error(data.error?.[0] || 'fetch failed');
      const raw = data.result[Object.keys(data.result)[0]];
      const candles = raw.slice(-60).map(c=>({time:c[0],open:+c[1],high:+c[2],low:+c[3],close:+c[4]}));

      buildChart();
      series = chart.addSeries(LightweightCharts.CandlestickSeries,{
        upColor:'#3dff7a', downColor:'#ff4433', borderUpColor:'#3dff7a', borderDownColor:'#ff4433',
        wickUpColor:'#3dff7a', wickDownColor:'#ff4433',
      });
      series.setData(candles);

      const tRes = await fetch('https://api.kraken.com/0/public/Ticker?pair=XBTUSD');
      const tData = await tRes.json();
      const t = tData.result[Object.keys(tData.result)[0]];
      const open=+t.o, last=+t.c[0], high=+t.h[1], low=+t.l[1];
      const pct = (last-open)/open*100;
      const up = last>=open;

      priceEl.innerHTML = fmt(last)+' <span class="cursor">▮</span>';
      priceEl.className = up?'up':'down';
      changeEl.textContent = `24H ${up?'▲':'▼'} ${pct>=0?'+':''}${pct.toFixed(2)}%`;
      changeEl.className = 'change '+(up?'up':'down');
      hlEl.textContent = `H ${fmt(high)} · L ${fmt(low)}`;
      dotEl.className = 'dot live';
    }catch(e){
      errorEl.textContent = 'LINK ERROR — RETRYING';
      dotEl.className = 'dot err';
      console.error(e);
    }
  }

  async function loadHashrate(){
    try{
      errorEl.textContent='';
      const res = await fetch('https://api.blockchain.info/charts/hash-rate?timespan=all&format=json&cors=true');
      const data = await res.json();
      if(!res.ok) throw new Error('HTTP '+res.status);
      const byQuarter = data.values.filter(v=>new Date(v.x*1000).getFullYear()>=2016)
        .reduce((acc,v)=>{
          const d=new Date(v.x*1000); const key=`${d.getFullYear()}-Q${Math.floor(d.getMonth()/3)+1}`;
          (acc[key]=acc[key]||{t:v.x,vals:[]}).vals.push(v.y);
          return acc;
        },{});
      const points = Object.values(byQuarter)
        .map(q=>({time:q.t, value:q.vals.reduce((a,b)=>a+b,0)/q.vals.length}))
        .sort((a,b)=>a.time-b.time);

      buildChart();
      lineSeries = chart.addLineSeries({color:'#ffb000', lineWidth:2});
      lineSeries.setData(points);

      const latest = points[points.length-1].value;
      const prev = points[points.length-2]?.value ?? latest;
      const up = latest>=prev;
      hashPriceEl.innerHTML = Math.round(latest).toLocaleString()+' TH/s <span class="cursor">▮</span>';
      hashPriceEl.className = up?'up':'down';
      hashChangeEl.textContent = `QUARTERLY AVG ${up?'▲':'▼'}`;
      hashChangeEl.className = 'change '+(up?'up':'down');
      dotEl.className = 'dot live';
    }catch(e){
      errorEl.textContent = 'LINK ERROR — RETRYING';
      dotEl.className = 'dot err';
      console.error(e);
    }
  }

  function refresh(){ currentView==='price' ? loadPrice() : loadHashrate(); }

  document.querySelectorAll('.key[data-view]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.key[data-view]').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      currentView = btn.dataset.view;
      $('quoteView').classList.toggle('hidden', currentView!=='price');
      $('hashView').classList.toggle('hidden', currentView!=='hashrate');
      $('timeToggle').style.display = currentView==='hashrate' ? 'none' : 'inline-block';
      refresh();
    });
  });

  $('timeToggle').addEventListener('click', e=>{
    currentInterval = currentInterval==='hour' ? '15min' : 'hour';
    e.target.textContent = currentInterval==='hour' ? 'F3 · 1H' : 'F3 · 15M';
    refresh();
  });

  window.addEventListener('resize', ()=>{ if(chart) chart.resize(chartEl.clientWidth, chartEl.clientHeight); });

  refresh();
  setInterval(refresh, 60000);
</script>
</body>
</html>
